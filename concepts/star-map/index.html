<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03060b">
<title>银河帝国 · 星图（界面概念稿）</title>
<link rel="icon" href="data:,">
<style>
:root{
  --sans:"HarmonyOS Sans SC","MiSans","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono","SF Mono",Consolas,monospace;
  --ink:#e9f2f5;--ink2:#b8cad1;--dim:#7f98a2;--faint:#4b626c;
  --line:rgba(150,205,225,.13);--line2:rgba(150,205,225,.24);
  --glass:linear-gradient(180deg,rgba(17,30,40,.74),rgba(7,13,19,.80));
  --gold:#ecc97f;--gold2:#ffe2a3;--cyan:#7fe3f0;--ally:#63c9ff;--red:#ff6a6a;--violet:#b49bff;--green:#7be0a6;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#03060b;color:var(--ink);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
canvas#sky{position:fixed;inset:0;display:block;cursor:grab}
canvas#sky.dragging{cursor:grabbing}
canvas#sky.pointing{cursor:pointer}
#vignette{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(1,3,7,.55) 100%),
  linear-gradient(180deg,rgba(2,5,10,.55),transparent 16%,transparent 80%,rgba(2,5,10,.7));}
#scan{position:fixed;inset:0;pointer-events:none;opacity:.05;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);mix-blend-mode:overlay}

/* ---------- glass ---------- */
.glass{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.035)}
.glass::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(170,235,255,.45),transparent);pointer-events:none}
.eyebrow{font:600 10px/1 var(--mono);letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
kbd{font:600 10px/1 var(--mono);color:var(--dim);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:2px 5px;margin-left:auto}

/* ---------- top bar ---------- */
.topbar{position:fixed;left:14px;right:14px;top:12px;height:60px;display:flex;align-items:center;gap:18px;padding:0 10px 0 16px;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding-right:18px;border-right:1px solid var(--line);height:36px}
.brand svg{width:30px;height:30px}
.brand b{display:block;font-size:15px;letter-spacing:.32em;font-weight:700;background:linear-gradient(180deg,#fff6dc,#e2bb6c);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font:600 8.5px/1 var(--mono);letter-spacing:.34em;color:var(--dim);margin-top:4px}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;flex:0 1 auto}
.crumbs button{padding:6px 10px;border-radius:8px;color:var(--ink2);white-space:nowrap;transition:.2s}
.crumbs button:hover{background:rgba(127,227,240,.08);color:var(--ink)}
.crumbs button.cur{color:var(--ink);font-weight:600}
.crumbs .sep{color:var(--faint);font-size:11px}
.crumbs .sub{font:500 10px var(--mono);color:var(--dim);margin-left:6px;letter-spacing:.06em}
.res{display:flex;gap:4px;margin-left:auto}
.res-cell{position:relative;display:flex;align-items:center;gap:9px;padding:6px 12px 8px 10px;border-radius:10px;transition:.2s;cursor:default}
.res-cell:hover{background:rgba(255,255,255,.035)}
.res-cell svg{width:22px;height:22px;flex:none;filter:drop-shadow(0 0 6px var(--c))}
.res-cell .v{font:600 14px/1 var(--mono);letter-spacing:.02em}
.res-cell .l{display:flex;gap:6px;font-size:10px;color:var(--dim);margin-top:4px;line-height:1}
.res-cell .l em{font-style:normal;color:var(--green);font-family:var(--mono)}
.res-cell .bar{position:absolute;left:41px;right:12px;bottom:4px;height:2px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.res-cell .bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c)}
.res-cell.warn .bar i{background:var(--red)}
.status{display:flex;align-items:center;gap:12px;padding-left:14px;border-left:1px solid var(--line);height:36px}
.live{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink2)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(123,224,166,.6);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(123,224,166,.55)}70%{box-shadow:0 0 0 8px rgba(123,224,166,0)}100%{box-shadow:0 0 0 0 rgba(123,224,166,0)}}
.clock{font:500 11px/1.25 var(--mono);color:var(--ink2);text-align:right}
.clock small{display:block;color:var(--faint);font-size:9px;letter-spacing:.18em}
.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#2b3d4a,#121d26);border:1px solid var(--line2);font:700 12px var(--mono);color:var(--gold);position:relative}
.avatar::after{content:"";position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid #0b141b}

/* ---------- left rail ---------- */
.rail{position:fixed;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:8px;z-index:15}
.rail button{position:relative;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:var(--ink2);transition:.18s}
.rail button svg{width:20px;height:20px}
.rail button:hover{background:rgba(127,227,240,.08);color:var(--ink)}
.rail button.on{background:linear-gradient(180deg,rgba(236,201,127,.18),rgba(236,201,127,.06));color:var(--gold2);box-shadow:inset 0 0 0 1px rgba(236,201,127,.3)}
.rail hr{border:0;height:1px;background:var(--line);margin:4px 6px}
.rail button[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:54px;top:50%;transform:translateY(-50%);white-space:nowrap;padding:6px 10px;border-radius:8px;background:rgba(6,12,18,.92);border:1px solid var(--line2);font-size:12px;color:var(--ink);pointer-events:none}

/* ---------- drawers ---------- */
.drawer{position:fixed;left:82px;top:88px;bottom:110px;width:330px;z-index:14;display:flex;flex-direction:column;padding:18px 16px 14px;
  opacity:0;transform:translateX(-14px);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
.drawer.open{opacity:1;transform:none;pointer-events:auto}
.drawer h3{font-size:16px;font-weight:600;letter-spacing:.08em;margin:6px 0 2px}
.x{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:8px;color:var(--dim);font-size:18px;line-height:1}
.x:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.empire-card{display:flex;gap:12px;align-items:center;margin:14px 0 12px;padding:12px;border-radius:12px;background:linear-gradient(135deg,rgba(236,201,127,.12),rgba(236,201,127,.02));border:1px solid rgba(236,201,127,.2)}
.empire-card .seal{width:42px;height:42px;flex:none}
.empire-card b{font-size:15px;letter-spacing:.1em;color:var(--gold2)}
.empire-card small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.kpi{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.kpi b{display:block;font:600 16px var(--mono)}
.kpi span{font-size:10px;color:var(--dim)}
.search{position:relative;margin-bottom:8px}
.search input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line2);background:rgba(0,0,0,.25);padding:0 12px 0 34px;outline:none;transition:.2s}
.search input:focus{border-color:rgba(127,227,240,.5);box-shadow:0 0 0 3px rgba(127,227,240,.08)}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--dim)}
.list{flex:1;overflow:auto;margin:0 -6px;padding:0 6px;scrollbar-width:thin;scrollbar-color:#2a3d48 transparent}
.row{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:10px;text-align:left;transition:.15s;position:relative}
.row:hover{background:rgba(127,227,240,.06)}
.row.sel{background:rgba(236,201,127,.08);box-shadow:inset 2px 0 0 var(--gold)}
.row canvas{width:30px;height:30px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--dim);font-size:11px}
.row .meta{text-align:right;font:500 10px var(--mono);color:var(--dim)}
.row .home-badge{font:700 9px var(--mono);color:#1b1408;background:var(--gold);padding:1px 5px;border-radius:4px;margin-left:6px;letter-spacing:.06em;vertical-align:1px}
.group-title{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin:10px 4px 4px;letter-spacing:.12em}

.layer{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;width:100%;text-align:left}
.layer:hover{background:rgba(255,255,255,.035)}
.layer .sw{width:34px;height:20px;border-radius:20px;background:rgba(255,255,255,.08);position:relative;transition:.2s;flex:none}
.layer .sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#7c8f97;transition:.25s cubic-bezier(.3,1.4,.5,1)}
.layer.on .sw{background:rgba(127,227,240,.25)}
.layer.on .sw::after{left:17px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.layer .t{flex:1}.layer .t b{display:block;font-weight:500}.layer .t small{color:var(--dim);font-size:11px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.legend span{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.025)}
.legend i{width:10px;height:10px;border-radius:3px;box-shadow:0 0 10px currentColor}
.help{margin-top:auto;padding:12px;border-radius:10px;border:1px dashed var(--line2);color:var(--dim);font-size:11.5px;line-height:1.9}
.help b{color:var(--ink2);font-weight:500}

/* ---------- inspector ---------- */
#inspector{position:fixed;right:14px;top:88px;bottom:216px;width:372px;z-index:14;display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:translateX(18px);pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1)}
#inspector.open{opacity:1;transform:none;pointer-events:auto}
.insp-scroll{flex:1;overflow:auto;padding:20px 20px 10px;scrollbar-width:thin;scrollbar-color:#2a3d48 transparent}
.insp-hero{position:relative;margin:-20px -20px 0;height:200px;overflow:hidden;border-bottom:1px solid var(--line)}
.insp-hero canvas{position:absolute;inset:0;width:100%;height:100%}
.insp-hero .ov{position:absolute;left:20px;right:20px;bottom:16px}
.insp-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(7,13,19,.92));pointer-events:none}
.insp-hero .ov{z-index:2}
.title{font-size:24px;font-weight:700;letter-spacing:.08em;margin:7px 0 4px;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.coord{display:flex;align-items:center;gap:10px;font:500 11px var(--mono);color:var(--ink2)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:20px;font:600 11px var(--sans);letter-spacing:.04em;border:1px solid currentColor;background:color-mix(in srgb,currentColor 12%,transparent)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.tag.me{color:var(--gold)}.tag.ally{color:var(--ally)}.tag.foe{color:var(--red)}.tag.npc{color:var(--violet)}.tag.none{color:#93a7ae}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}
.stat{padding:11px 12px;border-radius:11px;background:rgba(255,255,255,.028);border:1px solid var(--line)}
.stat span{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.stat b{display:block;font:600 17px/1.3 var(--mono);margin-top:3px}
.stat b small{font-size:11px;color:var(--dim);font-weight:500;margin-left:3px}
.sec{margin:16px 0 8px;display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.16em;color:var(--dim)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.desc{color:var(--ink2);font-size:12.5px;line-height:1.75}
.meter{display:grid;grid-template-columns:44px 1fr 46px;align-items:center;gap:10px;margin:9px 0;font-size:12px;color:var(--ink2)}
.meter .track{height:6px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.meter .track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 40%,transparent),var(--c));box-shadow:0 0 10px var(--c)}
.meter b{font:600 12px var(--mono);text-align:right;color:var(--ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 20px 18px;border-top:1px solid var(--line);background:rgba(0,0,0,.15)}
.btn{height:40px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;transition:.18s}
.btn:hover{border-color:rgba(127,227,240,.45);background:rgba(127,227,240,.07)}
.btn svg{width:16px;height:16px}
.btn.primary{grid-column:1/-1;height:46px;border:0;color:#1d1406;font-weight:700;letter-spacing:.12em;
  background:linear-gradient(180deg,#ffe6ad,#e0b25e);box-shadow:0 8px 26px rgba(236,201,127,.28),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 10px 32px rgba(236,201,127,.42),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.danger{color:#ffb0a8;border-color:rgba(255,106,106,.35)}
.btn.danger:hover{background:rgba(255,106,106,.1);border-color:rgba(255,106,106,.6)}
.btn.primary.danger{color:#fff;background:linear-gradient(180deg,#ff8b7c,#d84848);box-shadow:0 8px 26px rgba(255,90,90,.3)}
.btn.primary.violet{color:#fff;background:linear-gradient(180deg,#c6b2ff,#7f62e8);box-shadow:0 8px 26px rgba(150,120,255,.32)}
.btn.primary.ally{color:#04131d;background:linear-gradient(180deg,#a8e6ff,#4fb4e6);box-shadow:0 8px 26px rgba(99,201,255,.3)}
.body-row{display:flex;align-items:center;gap:11px;padding:8px 8px;border-radius:10px;width:100%;text-align:left;transition:.15s}
.body-row:hover{background:rgba(127,227,240,.06)}
.body-row canvas{width:26px;height:26px;flex:none}
.body-row .t{flex:1;font-size:12.5px}.body-row .t small{display:block;color:var(--dim);font-size:10.5px}
.body-row .dot{width:7px;height:7px;border-radius:50%}
.threat{display:flex;gap:3px}.threat i{width:14px;height:5px;border-radius:2px;background:rgba(255,255,255,.08)}.threat i.on{background:var(--violet);box-shadow:0 0 6px var(--violet)}
.timeline{position:relative;padding-left:16px}
.timeline::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.timeline div{position:relative;font-size:12px;color:var(--ink2);margin:7px 0}
.timeline div::before{content:"";position:absolute;left:-15px;top:5px;width:7px;height:7px;border-radius:50%;background:#0b141b;border:1px solid var(--cyan)}
.timeline small{color:var(--faint);font-family:var(--mono);margin-right:8px}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:7px;z-index:20;border-radius:18px}
.dock button{position:relative;width:64px;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--dim);transition:.18s}
.dock button svg{width:20px;height:20px;transition:.2s}
.dock button span{font-size:11px;letter-spacing:.06em}
.dock button:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.dock button:hover svg{transform:translateY(-1px)}
.dock button.on{color:var(--gold2);background:linear-gradient(180deg,rgba(236,201,127,.14),rgba(236,201,127,.03))}
.dock button.on::after{content:"";position:absolute;bottom:3px;width:18px;height:2px;border-radius:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.dock button.on svg{filter:drop-shadow(0 0 6px rgba(236,201,127,.7))}
.dock .badge{position:absolute;top:6px;right:13px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font:700 9.5px/16px var(--mono);box-shadow:0 0 10px rgba(255,90,90,.6)}
.dock hr{width:1px;height:30px;border:0;background:var(--line);margin:0 5px}
.more{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);z-index:21;padding:12px;display:grid;grid-template-columns:repeat(5,82px);gap:4px;opacity:0;pointer-events:none;transition:.25s cubic-bezier(.2,.8,.2,1)}
.more.open{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.more button{height:70px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--ink2);font-size:12px}
.more button:hover{background:rgba(127,227,240,.07);color:var(--ink)}
.more button svg{width:22px;height:22px}

/* ---------- bottom left feed ---------- */
.feed{position:fixed;left:82px;bottom:14px;width:300px;z-index:13;padding:12px 14px;transition:.3s}
.feed.hide{opacity:0;pointer-events:none;transform:translateY(8px)}
.feed-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.feed-head .eyebrow{flex:1}
.feed-item{display:flex;gap:10px;padding:6px 0;border-top:1px solid rgba(150,205,225,.06);font-size:12px;color:var(--ink2);animation:fin .5s both}
.feed-item:first-of-type{border-top:0}
.feed-item i{width:3px;border-radius:3px;flex:none;background:var(--c);box-shadow:0 0 8px var(--c)}
.feed-item small{display:block;font:500 10px var(--mono);color:var(--faint)}
@keyframes fin{from{opacity:0;transform:translateX(-6px)}}

/* ---------- minimap & zoom ---------- */
.navbox{position:fixed;right:14px;bottom:14px;z-index:13;padding:10px;display:flex;gap:10px;align-items:flex-end}
#mini{width:168px;height:168px;border-radius:10px;cursor:crosshair;display:block;background:#02050a}
.zoomcol{display:flex;flex-direction:column;gap:4px;align-items:center}
.zoomcol button{width:34px;height:34px;border-radius:9px;color:var(--ink2);border:1px solid var(--line);font-size:17px;display:grid;place-items:center}
.zoomcol button:hover{background:rgba(127,227,240,.08);color:var(--ink)}
.zoomcol .zv{font:600 10px var(--mono);color:var(--dim);margin:2px 0}
.scalebar{position:absolute;left:12px;top:-26px;font:500 10px var(--mono);color:var(--dim);display:flex;align-items:center;gap:8px}
.scalebar i{display:block;height:6px;border:1px solid var(--dim);border-top:0}

/* ---------- system orbit dock ---------- */
.orbits{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);z-index:12;display:flex;align-items:center;gap:4px;padding:8px 10px;opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 820px);overflow-x:auto;scrollbar-width:none}
.orbits.open{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.orbits .lbl{padding:0 10px 0 4px;border-right:1px solid var(--line);margin-right:4px}
.orbits .lbl b{display:block;font-size:12px}
.orb{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding:6px 0 5px;border-radius:10px;font-size:10.5px;color:var(--dim);flex:none;transition:.15s}
.orb canvas{width:30px;height:30px}
.orb:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.orb.sel{background:rgba(236,201,127,.1);color:var(--gold2);box-shadow:inset 0 0 0 1px rgba(236,201,127,.3)}
.orb.mine span::before{content:"◆ ";color:var(--gold);font-size:8px}

/* ---------- misc ---------- */
#tip{position:fixed;z-index:30;pointer-events:none;padding:9px 12px;border-radius:10px;background:rgba(5,10,16,.9);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;min-width:150px}
#tip.on{opacity:1}
#tip b{display:block;font-size:13px;letter-spacing:.05em}

<script>
"use strict";
/* =========================================================
   基础工具
   ========================================================= */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, TILT=.66, GW=1150, LY=50;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function gauss(R){return Math.sqrt(-2*Math.log(R()+1e-9))*Math.cos(TAU*R())}
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString();
const ROMAN=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ','Ⅹ','Ⅺ','Ⅻ'];

const FACTION={
  me:{name:'曦和帝国',col:'#ecc97f',rgb:'236,201,127',cls:'me'},
  ally:{name:'曙光联合体',col:'#63c9ff',rgb:'99,201,255',cls:'ally'},
  foe:{name:'赤潮军团',col:'#ff6a6a',rgb:'255,106,106',cls:'foe'},
  npc:{name:'遗落者据点',col:'#b49bff',rgb:'180,155,255',cls:'npc'},
  none:{name:'无主星域',col:'#93a7ae',rgb:'147,167,174',cls:'none'}
};
const STAR=[{c:'O',col:'#a8bdff',w:.03,t:'蓝超巨星'},{c:'B',col:'#b9ccff',w:.07,t:'蓝白主序星'},{c:'A',col:'#dbe5ff',w:.1,t:'白色主序星'},{c:'F',col:'#fbf8ff',w:.14,t:'黄白主序星'},{c:'G',col:'#fff1d6',w:.2,t:'黄矮星'},{c:'K',col:'#ffcf98',w:.22,t:'橙矮星'},{c:'M',col:'#ff9f72',w:.24,t:'红矮星'}];
const PTYPE={
  terrestrial:{name:'类地星',col:'#6cc0ff',res:[1,1,1],desc:'温和的海陆行星，拥有完整的三类矿产，适合作为综合型殖民地。'},
  mercury:{name:'金属岩星',col:'#c2c8cf',res:[3,.4,.4],desc:'致密的铁镍地壳裸露在恒星风下，金属储量是常规行星的三倍。'},
  mars:{name:'晶体岩星',col:'#ff8d5e',res:[.4,3,.4],desc:'赤色荒原下埋藏着巨型晶簇，晶体储量是常规行星的三倍。'},
  gas:{name:'气态巨星',col:'#e9c38b',res:[.3,.3,3],desc:'厚重的氢氦大气中漂浮着采集平台，气体储量是常规行星的三倍。'}
};

/* =========================================================
   银河生成
   ========================================================= */
const ARMS=4;
function armPoint(R,t,spread=1,lane=0){
  const arm=Math.floor(R()*ARMS);
  const r=70+Math.pow(t,.85)*930;
  const th=arm*TAU/ARMS+Math.log(r/70)*2.35+gauss(R)*.2*spread+lane;
  const j=(10+r*.045)*spread;
  return{x:Math.cos(th)*r+gauss(R)*j,y:Math.sin(th)*r+gauss(R)*j};
}
const A1='天玄苍曜辰渊澜烛霁岚衡璇玑昴毕参角亢氐房心尾箕斗牛虚危室壁奎娄胃觜轸翼张柳鬼织瑶珩璃'.split('');
const A2='枢渊庭阙门垣冠环原海港桥川峰溟野宫泽岬湾墟'.split('');
const systems=[];
(function genSystems(){
  const R=rng(42), used=new Set();
  let guard=0;
  while(systems.length<499&&guard++<20000){
    let p;
    if(R()<.14){const a=R()*TAU,r=140+R()*860;p={x:Math.cos(a)*r,y:Math.sin(a)*r}}
    else p=armPoint(R,R(),.75);
    const r=Math.hypot(p.x,p.y);
    if(r<125||r>1060)continue;
    if(systems.some(s=>(s.x-p.x)**2+(s.y-p.y)**2<15*15))continue;
    let name;do{name=A1[Math.floor(R()*A1.length)]+A1[Math.floor(R()*A1.length)]+A2[Math.floor(R()*A2.length)]}while(used.has(name)||name[0]===name[1]);
    used.add(name);
    let w=R(),k=0;while(k<STAR.length-1&&(w-=STAR[k].w)>0)k++;
    systems.push({id:0,name,x:p.x,y:p.y,star:STAR[k],owner:'none',lvl:0,tw:R()*TAU});
  }
  systems.sort((a,b)=>Math.atan2(a.y,a.x)-Math.atan2(b.y,b.x)||0);
  systems.forEach((s,i)=>s.id=i+1);
})();
const near=(x,y)=>systems.filter(s=>s.owner==='none').sort((a,b)=>((a.x-x)**2+(a.y-y)**2)-((b.x-x)**2+(b.y-y)**2));
function claim(x,y,n,owner){near(x,y).slice(0,n).forEach(s=>s.owner=owner)}
const HOME=near(Math.cos(.6)*540,Math.sin(.6)*540)[0];
HOME.star=STAR[4];
claim(HOME.x,HOME.y,10,'me');
claim(Math.cos(2.0)*600,Math.sin(2.0)*600,13,'ally');
claim(Math.cos(-.9)*470,Math.sin(-.9)*470,15,'foe');
{const R=rng(9);let n=0;while(n<24){const s=systems[Math.floor(R()*systems.length)];if(s.owner==='none'){s.owner='npc';s.lvl=1+Math.floor(R()*5);n++}}}

const NPC_NAME=['遗落货仓','废弃前哨','赤铁守备站','卡戎舰队','苍穹裂隙'];
function planetsOf(s){
  if(s._p)return s._p;
  const R=rng(s.id*977+13), n=3+Math.floor(R()*7), out=[];
  for(let i=0;i<n;i++){
    const f=i/(n-1||1);
    let type=f<.3?(R()<.5?'mercury':'mars'):f<.65?(R()<.55?'terrestrial':R()<.5?'mars':'mercury'):(R()<.7?'gas':'terrestrial');
    const size=type==='gas'?1.6+R()*1.1:.6+R()*.7;
    out.push({sys:s,idx:i+1,name:`${s.name} ${ROMAN[i]}`,type,size,orbit:1.9+i*1.05+R()*.2,phase:R()*TAU,speed:.12/Math.pow(1+i,.9),
      moons:type==='gas'?Math.floor(R()*4):Math.floor(R()*2.2),ring:type==='gas'&&R()<.45,seed:s.id*31+i,owner:'none',
      temp:Math.round(420-f*600+gauss(R)*20),diam:Math.round((type==='gas'?60000:6000)*size+R()*2000),build:0});
  }
  if(s.owner!=='none'){
    out.forEach((p,i)=>{if(s.owner==='npc'?i===Math.floor(n/2):rng(p.seed)()<.55)p.owner=s.owner});
    if(!out.some(p=>p.owner===s.owner))out[0].owner=s.owner;
  }
  if(s===HOME){const h=out[Math.min(2,n-1)];h.type='terrestrial';h.size=1.25;h.name='曦和';h.home=true;h.owner='me';h.ring=false;h.temp=17}
  out.forEach(p=>{if(p.owner==='me')p.build=p.home?46:8+Math.floor(rng(p.seed+5)()*26)});
  return s._p=out;
}
const myPlanets=()=>systems.filter(s=>s.owner==='me').flatMap(s=>planetsOf(s).filter(p=>p.owner==='me')).sort((a,b)=>(b.home?1:0)-(a.home?1:0)||b.build-a.build);

/* =========================================================
   纹理
   ========================================================= */
const TS=2048, TSC=TS/(2*GW);
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c}
let galTex,terTex,miniTex;
function buildGalaxy(){
  const c=mk(TS),g=c.getContext('2d');g.translate(TS/2,TS/2);g.scale(TSC,TSC);
  let gr=g.createRadialGradient(0,0,0,0,0,1050);
  gr.addColorStop(0,'rgba(255,226,180,.9)');gr.addColorStop(.06,'rgba(255,196,140,.42)');gr.addColorStop(.18,'rgba(160,130,190,.13)');gr.addColorStop(.5,'rgba(60,100,170,.06)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(-GW,-GW,2*GW,2*GW);
  g.globalCompositeOperation='lighter';
  const R=rng(7);
  for(let i=0;i<340;i++){
    const t=R(),p=armPoint(R,t,1.1),rad=25+R()*95;
    const h=t<.18?30+R()*20:R()<.72?200+R()*30:R()<.6?280+R()*30:330+R()*20;
    gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);
    gr.addColorStop(0,`hsla(${h},85%,62%,${.07+R()*.1})`);gr.addColorStop(1,'hsla(0,0%,0%,0)');
    g.fillStyle=gr;g.fillRect(p.x-rad,p.y-rad,rad*2,rad*2);
  }
  const buckets=['rgba(255,236,205,.7)','rgba(255,214,170,.55)','rgba(205,222,255,.6)','rgba(170,200,255,.5)','rgba(140,180,255,.32)','rgba(255,255,255,.85)','rgba(255,170,205,.5)'].map(c=>({c,pts:[]}));
  for(let i=0;i<140000;i++){
    let x,y,b;
    if(i<24000){const r=Math.abs(gauss(R))*170,a=R()*TAU;x=Math.cos(a)*r;y=Math.sin(a)*r*.92;b=r<90?0:1}
    else if(i<34000){const a=R()*TAU,r=R()*1050;x=Math.cos(a)*r;y=Math.sin(a)*r;b=4}
    else{const p=armPoint(R,R(),1);x=p.x;y=p.y;b=R()<.06?5:R()<.03?6:2+Math.floor(R()*3)}
    buckets[b].pts.push(x,y,R()<.9?1.1:2);
  }
  for(const bk of buckets){g.fillStyle=bk.c;g.beginPath();for(let i=0;i<bk.pts.length;i+=3)g.rect(bk.pts[i],bk.pts[i+1],bk.pts[i+2],bk.pts[i+2]);g.fill()}
  g.globalCompositeOperation='source-over';
  for(let i=0;i<900;i++){const p=armPoint(R,.1+R()*.8,.55,-.13),rad=10+R()*26;gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);gr.addColorStop(0,'rgba(4,5,10,.28)');gr.addColorStop(1,'rgba(4,5,10,0)');g.fillStyle=gr;g.fillRect(p.x-rad,p.y-rad,rad*2,rad*2)}
  g.globalCompositeOperation='lighter';
  for(let i=0;i<160;i++){const p=armPoint(R,.15+R()*.8,.5),rad=4+R()*9;gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,rad);const pink=R()<.6;gr.addColorStop(0,pink?'rgba(255,140,190,.55)':'rgba(150,200,255,.6)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(p.x-rad,p.y-rad,rad*2,rad*2)}
  galTex=c;
}
function buildTerritory(){
  const S=1024,sc=S/(2*GW),out=mk(S),o=out.getContext('2d');
  for(const f of ['me','ally','foe']){
    const own=systems.filter(s=>s.owner===f), col=FACTION[f].rgb;
    const fill=mk(S),fg=fill.getContext('2d');fg.translate(S/2,S/2);fg.scale(sc,sc);fg.fillStyle=`rgb(${col})`;
    fg.beginPath();own.forEach(s=>{fg.moveTo(s.x+58,s.y);fg.arc(s.x,s.y,58,0,TAU)});fg.fill();
    const edge=mk(S),eg=edge.getContext('2d');eg.drawImage(fill,0,0);eg.globalCompositeOperation='destination-out';eg.translate(S/2,S/2);eg.scale(sc,sc);
    eg.beginPath();own.forEach(s=>{eg.moveTo(s.x+58-3.2,s.y);eg.arc(s.x,s.y,58-3.2,0,TAU)});eg.fill();
    o.globalAlpha=.11;o.drawImage(fill,0,0);
    o.globalAlpha=.85;o.drawImage(edge,0,0);
  }
  o.globalAlpha=1;terTex=out;
}
let bgTex;
function buildBg(){
  const w=Math.ceil(W*1.25),h=Math.ceil(H*1.25),c=mk(w,h),g=c.getContext('2d'),R=rng(3);
  g.fillStyle='#02040a';g.fillRect(0,0,w,h);
  for(const [x,y,r,col] of [[.15,.2,.5,'rgba(30,70,110,.18)'],[.85,.8,.55,'rgba(70,30,100,.16)'],[.7,.15,.35,'rgba(20,90,100,.10)'],[.25,.85,.4,'rgba(90,40,60,.10)']]){
    const gr=g.createRadialGradient(x*w,y*h,0,x*w,y*h,r*w);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);
  }
  for(let i=0;i<w*h/1400;i++){const a=Math.pow(R(),3);g.fillStyle=`rgba(${R()<.2?'255,220,200':'210,225,255'},${.15+a*.8})`;const s=a>.6?1.6:1;g.fillRect(R()*w,R()*h,s,s)}
  bgTex=c;
}
const spriteCache={};
function glowSprite(col){
  if(spriteCache[col])return spriteCache[col];
  const c=mk(64),g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.12,col);gr.addColorStop(.35,col.replace(/^#(..)(..)(..)$/,(m,r,gg,b)=>`rgba(${parseInt(r,16)},${parseInt(gg,16)},${parseInt(b,16)},.25)`));gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return spriteCache[col]=c;
}
const fine=[];{const R=rng(77);for(let i=0;i<9000;i++){const p=R()<.8?armPoint(R,R(),1.3):{x:(R()*2-1)*1000,y:(R()*2-1)*1000};fine.push(p.x,p.y,.3+R()*.7)}}

/* ---------- 行星表面 ---------- */
const surfCache={};
function surface(p){
  const key=p.type+p.seed;if(surfCache[key])return surfCache[key];

  // 轨道平面网格
  ctx.strokeStyle='rgba(127,227,240,.035)';ctx.lineWidth=1;
  for(let i=1;i<=6;i++){ctx.beginPath();ctx.ellipse(cx,cy,sc*i*1.6,sc*i*1.6*TL,0,0,TAU);ctx.stroke()}
  planetScreen=[];
  const pos=ps.map(p=>{const a=p.phase+sysTime*p.speed+sysRot;return{p,a,x:cx+Math.cos(a)*p.orbit*sc,y:cy+Math.sin(a)*p.orbit*sc*TL,r:clamp(p.size*sc*.22,5,46)}});
  for(const q of pos){
    const p=q.p,sel=p===selPlanet,hov=p===hoverPlanet,f=FACTION[p.owner];
    ctx.lineWidth=sel?1.4:1;
    ctx.strokeStyle=sel?'rgba(127,227,240,.6)':p.owner!=='none'?`rgba(${f.rgb},.28)`:'rgba(170,205,220,.13)';
    ctx.beginPath();ctx.ellipse(cx,cy,p.orbit*sc,p.orbit*sc*TL,0,0,TAU);ctx.stroke();
    if(sel){ctx.save();ctx.setLineDash([2,6]);ctx.lineDashOffset=-t*10;ctx.strokeStyle='rgba(127,227,240,.9)';ctx.beginPath();ctx.ellipse(cx,cy,p.orbit*sc,p.orbit*sc*TL,0,q.a-.6,q.a);ctx.stroke();ctx.restore()}
  }
  const R=clamp(sc*.42,14,60);
  const draw=q=>{
    const p=q.p,dx=cx-q.x,dy=cy-q.y,d=Math.hypot(dx,dy)||1;
    if(p.ring)ring(ctx,q.x,q.y,q.r,false);
    drawPlanet(ctx,q.x,q.y,q.r,p,dx/d,dy/d);
    if(p.ring)ring(ctx,q.x,q.y,q.r,true);
    for(let m=0;m<p.moons;m++){const ma=sysTime*(.9+m*.35)+m*2.1,mr=q.r*(1.7+m*.45);const mx=q.x+Math.cos(ma)*mr,my=q.y+Math.sin(ma)*mr*.45;ctx.fillStyle=Math.sin(ma)<0?'rgba(150,160,170,.5)':'#c9d2d8';ctx.beginPath();ctx.arc(mx,my,Math.max(1.4,q.r*.13),0,TAU);ctx.fill()}
    planetScreen.push({p,x:q.x,y:q.y,r:q.r});
  };
  pos.filter(q=>Math.sin(q.a)<0).sort((a,b)=>a.y-b.y).forEach(draw);
  drawStar(cx,cy,R,hexRgb(cur.star.col),t);
  pos.filter(q=>Math.sin(q.a)>=0).sort((a,b)=>a.y-b.y).forEach(draw);
  for(const q of pos){
    const p=q.p,f=FACTION[p.owner];
    if(p===selPlanet)reticle(q.x,q.y,q.r+10,'rgba(127,227,240,.95)',t);
    else if(p===hoverPlanet){ctx.strokeStyle='rgba(220,240,245,.7)';ctx.beginPath();ctx.arc(q.x,q.y,q.r+7,0,TAU);ctx.stroke()}
    if(layers.labels){
      ctx.save();ctx.textAlign='center';ctx.font=`600 ${p.home?13:11.5}px ${FONT}`;ctx.shadowColor='#000';ctx.shadowBlur=8;
      ctx.fillStyle=p.owner==='none'?'#dfe8ec':f.col;ctx.fillText((p.home?'◆ ':'')+p.name,q.x,q.y+q.r+18);
      if(p===selPlanet||p===hoverPlanet||p.home||p.owner!=='none'&&sysZoom>1.4){ctx.font='500 9.5px Consolas,monospace';ctx.fillStyle='rgba(170,190,198,.8)';ctx.fillText(`${PTYPE[p.type].name} · 1:${cur.id}:${p.idx}`,q.x,q.y+q.r+31)}ctx.restore();
    }
  }
  ctx.restore();
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  const k=1-Math.pow(.0015,dt);
  cam.x=lerp(cam.x,cam.tx,k);cam.y=lerp(cam.y,cam.ty,k);cam.z=Math.exp(lerp(Math.log(cam.z),Math.log(cam.tz),k));
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(mode==='galaxy')drawGalaxy(t,dt);else drawSystem(t,dt);
  if(trans){
    trans.t+=dt/(trans.phase==='out'?.5:.6);
    if(trans.phase==='out'){veil=trans.t;if(trans.t>=1){trans.done();trans.phase='in';trans.t=0}}
    else{veil=1-trans.t;if(trans.t>=1){trans=null;veil=0}}
  }
  if(veil>0){const gr=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);gr.addColorStop(0,`rgba(2,4,10,${veil*.85})`);gr.addColorStop(1,`rgba(2,4,10,${Math.min(1,veil*1.1)})`);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
  drawMini();
  updateScale();
  requestAnimationFrame(frame);
}

let down=null,moved=false;

cv.addEventListener('pointermove',e=>{
  if(down){
    const dx=e.clientX-down.x,dy=e.clientY-down.y;
    if(!moved&&Math.hypot(dx,dy)>4){moved=true;cv.classList.add('dragging');tip(null)}
    if(moved){
      if(mode==='galaxy'){cam.tx=down.cx-dx/cam.z;cam.ty=down.cy-dy/(cam.z*TILT);cam.x=cam.tx;cam.y=cam.ty;clampCam()}
      else{sysRotT=down.rot+dx*.006}
    }
    return;
  }

});
cv.addEventListener('pointerup',e=>{
  cv.classList.remove('dragging');
  if(down&&!moved)click(e.clientX,e.clientY);
  down=null;
});
cv.addEventListener('pointerleave',()=>{hover=null;hoverPlanet=null;tip(null)});
cv.addEventListener('dblclick',e=>{
  if(mode==='galaxy'){pick(e.clientX,e.clientY);if(hover)enterSystem(hover)}
  else{pick(e.clientX,e.clientY);if(hoverPlanet)toast(`进入 ${hoverPlanet.name}`,hoverPlanet.owner==='me'?'切换至行星基地视图（概念稿未接入）':'非本方行星仅显示地貌')}
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*.0015);
  if(mode==='galaxy'){
    const before=unproj(e.clientX,e.clientY,{x:cam.tx,y:cam.ty,z:cam.tz});
    const nz=clamp(cam.tz*f,fitZoom()*.7,9);
    if(nz>=9&&f>1&&(hover||selSys)){enterSystem(hover||selSys);return}
    cam.tz=nz;cam.tx=before.x-(e.clientX-W/2)/nz;cam.ty=before.y-(e.clientY-H/2)/(nz*TILT);clampCam();
  }else{
    sysZoomT=clamp(sysZoomT*f,.55,2.6);
    if(sysZoomT<=.56&&f<1&&!trans)exitSystem();
  }
},{passive:false});
function clampCam(){const r=Math.hypot(cam.tx,cam.ty);if(r>1100){cam.tx*=1100/r;cam.ty*=1100/r}}
function pick(x,y){
  let best=null,bd=16*16;
  if(mode==='galaxy'){
    for(const s of systems){const p=proj(s.x,s.y),d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;best=s}}
    const o=proj(0,0);hoverBH=!best&&Math.hypot(o.x-x,o.y-y)<Math.max(14,26*cam.z*1.8);
    hover=best;
    cv.classList.toggle('pointing',!!best||hoverBH);
    if(best)tip(best,x,y);else if(hoverBH)tip('bh',x,y);else tip(null);
  }else{
    for(const q of planetScreen){const d=Math.hypot(q.x-x,q.y-y);if(d<q.r+8&&d*d<bd*4){bd=d*d;best=q.p}}
    hoverPlanet=best;cv.classList.toggle('pointing',!!best);
    if(best)tip(best,x,y);else tip(null);
  }
}
function click(x,y){

    if(hover){selSys=hover;openInspector({kind:'sys',s:hover})}

    else{selSys=null;closeInspector()}
  }else{
    if(hoverPlanet){selPlanet=hoverPlanet;openInspector({kind:'planet',p:hoverPlanet})}
    else{const {cx,cy}=sysGeom();if(Math.hypot(cx-x,cy-y)<50){selPlanet=null;openInspector({kind:'sys',s:cur})}else{selPlanet=null;closeInspector()}}

}

  trans={phase:'out',t:0,to:'system',done(){
    mode='system';cur=s;sysZoom=.7;sysZoomT=1;sysRotT=sysRot=0;sysTime=0;hover=null;
    selPlanet=planet||planetsOf(s).find(p=>p.home)||null;

  }};
}

    mode='galaxy';cam.x=cam.tx=s.x;cam.y=cam.ty=s.y;cam.z=8;cam.tz=2.4;selSys=s;cur=null;selPlanet=null;hoverPlanet=null;

function renderCrumbs(){
  const parts=[`<button data-cr="galaxy" class="${mode==='galaxy'&&!selSys?'cur':''}">第 1 银河<span class="sub">MILKY-01</span></button>`];
  const s=mode==='system'?cur:selSys;
  if(s)parts.push(`<span class="sep">›</span><button data-cr="sys" class="${mode==='system'&&!selPlanet||mode==='galaxy'?'cur':''}">${s.name}<span class="sub">1:${s.id}</span></button>`);
  if(mode==='system'&&selPlanet)parts.push(`<span class="sep">›</span><button class="cur" data-cr="planet">${selPlanet.name}<span class="sub">1:${cur.id}:${selPlanet.idx}</span></button>`);
  $('#crumbs').innerHTML=parts.join('');
}
$('#crumbs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cr==='galaxy'){if(mode==='system')exitSystem();else fitGalaxy()}
  else if(b.dataset.cr==='sys'){if(mode==='galaxy'&&selSys)enterSystem(selSys);else{selPlanet=null;openInspector({kind:'sys',s:cur});renderOrbits();renderCrumbs()}}
});

  const b=e.target.closest('button');if(!b)return;const k=b.dataset.rail;

const thumbCache=new Map();
function thumbFor(p,n=60){const k=p.seed+'-'+n+p.type;if(!thumbCache.has(k))thumbCache.set(k,thumb(p,n));return thumbCache.get(k)}
function mountThumbs(root){root.querySelectorAll('canvas[data-p]').forEach(c=>{const [sid,idx]=c.dataset.p.split(':').map(Number);const p=planetsOf(systems[sid-1])[idx-1];c.width=c.height=60;c.getContext('2d').drawImage(thumbFor(p),0,0)})}
function renderColonies(){
  const q=$('#q').value.trim(),all=myPlanets(),list=all.filter(p=>!q||p.name.includes(q)||p.sys.name.includes(q));
  $('#kpis').innerHTML=`<div class="kpi"><b>${mine.length}</b><span>恒星系</span></div><div class="kpi"><b>${all.length}</b><span>殖民星球</span></div><div class="kpi"><b>${all.reduce((a,p)=>a+p.build,0)}</b><span>建筑总数</span></div>`;
  const groups={};list.forEach(p=>(groups[p.sys.name]??=[]).push(p));
  $('#colony-list').innerHTML=Object.entries(groups).map(([n,ps])=>`<div class="group-title"><span>${n} · 1:${ps[0].sys.id}</span><span>${ps.length} 颗</span></div>`+ps.map(p=>`<button class="row${p===selPlanet?' sel':''}" data-sid="${p.sys.id}" data-idx="${p.idx}"><canvas data-p="${p.sys.id}:${p.idx}"></canvas><div class="t"><b>${p.name}${p.home?'<span class="home-badge">母星</span>':''}</b><small>${PTYPE[p.type].name} · 建筑 ${p.build}</small></div><div class="meta">1:${p.sys.id}:${p.idx}</div></button>`).join('')).join('')||`<p style="color:var(--dim);padding:20px 8px;text-align:center">没有匹配的星球</p>`;

$('#q').addEventListener('input',renderColonies);
$('#colony-list').addEventListener('click',e=>{
  const b=e.target.closest('.row');if(!b)return;

  if(mode==='system'&&cur===s){selPlanet=p;openInspector({kind:'planet',p});renderOrbits();renderCrumbs();renderColonies();return}

function stat(k,v,u=''){return`<div class="stat"><span>${k}</span><b>${v}${u?`<small>${u}</small>`:''}</b></div>`}
function orbitMini(s){
  const ps=planetsOf(s),max=ps[ps.length-1].orbit+.6,sc=150/max;
  return`<svg viewBox="-170 -64 340 128" style="width:100%;height:auto;margin:6px 0 2px;display:block">
    <defs><radialGradient id="sg"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="${s.star.col}"/><stop offset="1" stop-color="${s.star.col}" stop-opacity="0"/></radialGradient></defs>
    ${ps.map(p=>`<ellipse rx="${p.orbit*sc}" ry="${p.orbit*sc*.36}" fill="none" stroke="${p.owner==='none'?'rgba(170,205,220,.16)':FACTION[p.owner].col}" stroke-opacity="${p.owner==='none'?1:.45}"/>`).join('')}
    <circle r="16" fill="url(#sg)"/>
    ${ps.map(p=>{const a=p.phase;return`<circle cx="${Math.cos(a)*p.orbit*sc}" cy="${Math.sin(a)*p.orbit*sc*.36}" r="${clamp(p.size*2.2,2.2,6)}" fill="${PTYPE[p.type].col}"/>`}).join('')}
  </svg>`;
}
function heroCanvas(draw){
  cancelAnimationFrame(heroAnim);
  const c=insp.querySelector('.insp-hero canvas');if(!c)return;
  const w=c.clientWidth||372,h=c.clientHeight||210;c.width=w*DPR;c.height=h*DPR;const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  const t0=performance.now();
  const loop=now=>{draw(g,w,h,(now-t0)/1000);heroAnim=requestAnimationFrame(loop)};heroAnim=requestAnimationFrame(loop);
}
function heroBg(g,w,h,tint){
  g.clearRect(0,0,w,h);g.drawImage(bgTex,-40,-30);
  const gr=g.createRadialGradient(w*.62,h*.45,0,w*.62,h*.45,w*.7);gr.addColorStop(0,tint);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);
}

}
insp.addEventListener('click',e=>{
  if(e.target.closest('[data-ix]')){selSys=mode==='galaxy'?null:selSys;selPlanet=null;closeInspector();renderOrbits();renderCrumbs();return}
  if(e.target.closest('[data-enter]')){enterSystem(inspect.s);return}
  const a=e.target.closest('[data-act]');if(a){toast(a.dataset.act);return}
  const g=e.target.closest('[data-goto]');
  if(g){const [sid,idx]=g.dataset.goto.split(':').map(Number),s=systems[sid-1],p=planetsOf(s)[idx-1];
    if(mode==='system'&&cur===s){selPlanet=p;openInspector({kind:'planet',p});renderOrbits();renderCrumbs()}else enterSystem(s,p)}
});

/* ---------- 轨道索引 ---------- */
function renderOrbits(){
  const el=$('#orbits');
  if(mode!=='system'){el.classList.remove('open');return}
  el.innerHTML=`<div class="lbl"><div class="eyebrow">ORBITS</div><b>${cur.name}</b></div>`+planetsOf(cur).map(p=>`<button class="orb${p===selPlanet?' sel':''}${p.owner==='me'?' mine':''}" data-goto="${cur.id}:${p.idx}"><canvas data-p="${cur.id}:${p.idx}"></canvas><span>${ROMAN[p.idx-1]}</span></button>`).join('');
  mountThumbs(el);el.classList.add('open');
}
$('#orbits').addEventListener('click',e=>{const b=e.target.closest('[data-goto]');if(!b)return;const p=planetsOf(cur)[b.dataset.goto.split(':')[1]-1];selPlanet=p;openInspector({kind:'planet',p});renderOrbits();renderCrumbs()});

/* ---------- 底部导航 ---------- */
const DOCK=[['星图','map'],['建设','build'],['防务','shield'],['造舰','ship'],['研究','lab'],['舰队','fleet'],['战报','report',3],['联盟','alliance'],['通讯','chat',12]];
const MORE=[['档案','archive'],['战场','battle'],['市政','city'],['物流','truck'],['月球','moon'],['导弹','missile'],['排名','rank'],['暗物质','dm'],['设置','gear']];
$('#dock').innerHTML=DOCK.map(([n,i,b],k)=>`<button class="${k===0?'on':''}" data-nav="${n}">${svg(i)}<span>${n}</span>${b?`<em class="badge">${b}</em>`:''}</button>`).join('')+`<hr><button data-more>${svg('more')}<span>更多</span></button>`;
$('#more').innerHTML=MORE.map(([n,i])=>`<button data-nav="${n}">${svg(i)}${n}</button>`).join('');
function toggleMore(v){$('#more').classList.toggle('open',v)}
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-more]');if(m){toggleMore(!$('#more').classList.contains('open'));return}
  const n=e.target.closest('[data-nav]');
  if(n){toggleMore(false);if(n.dataset.nav!=='星图')toast(`前往「${n.dataset.nav}」`);return}
  if(!e.target.closest('#more'))toggleMore(false);
});

/* ---------- 动态 ---------- */
const FEED=[
  ['#ff6a6a','警报：赤潮突击集群正向我方星域推进','刚刚'],
  ['#ecc97f',`破晓舰队已从 ${HOME.name} 出航`,'2 分钟前'],
  ['#63c9ff',`曙光联合体占领 ${allies[5].name}`,'9 分钟前'],
  ['#7be0a6','研究完成：深空曲率引擎 Ⅲ','17 分钟前'],
  ['#b49bff',`侦察报告：${systems.filter(s=>s.owner==='npc').sort((a,b)=>b.lvl-a.lvl)[0].name} 发现遗落者信号`,'31 分钟前'],
];
$('#feed-list').innerHTML=FEED.map(([c,t,ts],i)=>`<div class="feed-item" style="--c:${c};animation-delay:${2+i*.12}s"><i></i><div>${t}<small>${ts}</small></div></div>`).join('');

/* =========================================================
   启动
   ========================================================= */
function resize(){
  DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  buildBg();
}
addEventListener('resize',resize);
const steps=[['校准银河坐标',buildGalaxy],['绘制势力疆域',buildTerritory],['加载小地图',buildMini],['同步舰队航线',()=>{}]];
(async function boot(){
  FONT=getComputedStyle(document.body).fontFamily;
  resize();
  for(let i=0;i<steps.length;i++){$('#intro-text').textContent=steps[i][0];await new Promise(r=>setTimeout(r,60));steps[i][1]();$('#intro-bar').style.width=((i+1)/steps.length*100)+'%'}
  renderCrumbs();renderLayers();
  const fz=fitZoom();cam.x=cam.tx=0;cam.y=cam.ty=0;cam.z=fz*.55;cam.tz=fz;
  requestAnimationFrame(frame);
  setTimeout(()=>$('#intro').classList.add('done'),250);
  setTimeout(()=>{flyTo(HOME.x*.55,HOME.y*.55,fz*1.7)},1600);
  setTimeout(()=>$('#hint').classList.add('fade'),7000);
  if(location.hash==='#home')setTimeout(()=>enterSystem(HOME),400);
})();
</script>
