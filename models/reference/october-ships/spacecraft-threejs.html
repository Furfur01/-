<body>
  <main id="viewport" aria-label="可旋转与缩放的飞船三维模型"></main>
  <header class="header">
    <div class="title-block"><div class="eyebrow">SPACECRAFT STUDY / 01</div><h1>参考舰体 · 三维复原</h1><div class="subtitle">基于参考图重建的可交互舰船模型</div></div>
    <div class="header-actions">
      <button class="button" id="theme" title="切换深色与浅色环境" aria-label="切换深色与浅色环境" aria-pressed="false"><svg viewBox="0 0 20 20"><path d="M15.7 12.2A6.5 6.5 0 0 1 7.8 4.3 6.5 6.5 0 1 0 15.7 12.2Z"/></svg><span class="label">深色环境</span></button>
      <button class="button export" id="export" title="导出完整舰船模型为 GLB 文件"><svg viewBox="0 0 20 20"><path d="M10 3v9m-3-3 3 3 3-3M4 13v3h12v-3"/></svg><span>导出 GLB</span></button>
    </div>
  </header>
  <nav class="view-index" aria-label="观察方向">
    <div class="caption">VIEWPOINT</div>
    <button class="view-button" data-view="perspective" aria-pressed="true" title="透视视角 · 快捷键 1"><span class="key">01</span>透视</button>
    <button class="view-button" data-view="top" aria-pressed="false" title="正交俯视 · 快捷键 2"><span class="key">02</span>俯视</button>
    <button class="view-button" data-view="side" aria-pressed="false" title="正交侧视 · 快捷键 3"><span class="key">03</span>侧视</button>
    <button class="view-button" data-view="front" aria-pressed="false" title="正交舰首 · 快捷键 4"><span class="key">04</span>舰首</button>
    <button class="view-button" data-view="rear" aria-pressed="false" title="正交舰尾 · 快捷键 5"><span class="key">05</span>舰尾</button>
  </nav>
  <div class="view-label" id="view-label">PERSPECTIVE VIEW</div>
  <aside class="bottom-left" aria-label="模型统计">
    <div class="model-stats"><div><b id="triangle-count">—</b><span>三角面</span></div><div><b id="mesh-count">—</b><span>网格部件</span></div></div>
    <div class="axis-note">REAL-TIME GEOMETRY / THREE.JS</div>
  </aside>
  <div class="toolbar" role="toolbar" aria-label="模型显示设置">
    <button class="button" id="rotate" aria-pressed="false" title="开启或关闭自动旋转"><span class="toggle-dot"></span>自动旋转</button>
    <button class="button" id="wireframe" aria-pressed="false" title="查看模型三角面线框"><span class="toggle-dot"></span>线框</button>
    <button class="button" id="engines" aria-pressed="true" title="开启或关闭引擎发光"><span class="toggle-dot"></span>引擎光</button>
    <span class="divider"></span>
    <button class="button" id="reset" title="复位视角 · 快捷键 R"><svg viewBox="0 0 20 20"><path d="M4.2 7a6 6 0 1 1 0 6M4 3.5V7h3.5"/></svg>复位</button>
  </div>
  <div class="help"><span>左键拖动旋转 · 滚轮缩放</span><span>右键拖动平移 · R 复位</span></div>
  <div id="loading" class="loading"><span class="spinner"></span><span>正在装配舰体…</span></div>
  <div id="error" class="error" role="alert"></div>
