<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>钛能守卫者 · Titanium Guardian</title>
  <style>
    :root{color-scheme:dark;--bg:#101820;--ink:#e5ecf0;--muted:#84939e;--line:rgba(194,213,229,.15);--cyan:#96dce0;--panel:rgba(20,30,39,.82)}

  <header class="topbar">
    <div class="identity"><span class="mark" aria-hidden="true"></span><div><h1>钛能守卫者</h1><div class="subtitle">TITANIUM GUARDIAN</div></div></div>
    <div class="edition"><b>舰船模型 · 01</b>THREE.JS / 3D STUDY</div>

  <div class="hint">拖动旋转<span>·</span>滚轮缩放<span>·</span>右键平移</div>

    <div class="controls">

        <button class="control" data-view="side" aria-pressed="false" title="侧视 [3]">侧视</button>

      </div>
      <div class="group" role="group" aria-label="展示设置">
        <button class="control" id="rotate" aria-pressed="false" title="自动旋转 [A]">旋转</button>
        <button class="control" id="wireframe" aria-pressed="false" title="线框 [W]">线框</button>
        <button class="control" id="glow" aria-pressed="true" title="舰体灯效">灯效</button>
        <span class="divider"></span>
        <button class="control" id="reset" title="恢复初始视角 [R]">重置</button>
      </div>
      <div class="group export-group" role="group" aria-label="模型导出">

        <button class="control" id="screenshot" title="保存当前画面">截图</button>
