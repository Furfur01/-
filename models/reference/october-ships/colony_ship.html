<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>殖民船 · Three.js 三维模型</title>
  <style>
    :root { color-scheme: dark; --text:#eff3f6; --muted:#89959e; --border:rgba(218,233,244,.13); --panel:rgba(27,34,42,.86); --hover:rgba(220,235,245,.075); --active:#e9bf6f; --ink:#1e242c; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    body { font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif; background:#151b23; color:var(--text); -webkit-font-smoothing:antialiased; }
    button { font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; }
    button:focus-visible { outline:2px solid var(--active); outline-offset:4px; }
    #viewport { position:absolute; inset:0; background:radial-gradient(ellipse at 48% 43%, #37414c 0%, #242d38 45%, #151b23 100%); transition:background .25s; }
    #viewport canvas { width:100%; height:100%; display:block; touch-action:none; outline:none; }
    body.light { color-scheme:light; --text:#27333d; --muted:#6c7881; --border:rgba(47,65,79,.16); --panel:rgba(238,242,243,.92); --hover:rgba(46,65,77,.075); --active:#a46c26; --ink:#fff; }
    body.light #viewport { background:radial-gradient(ellipse at 48% 43%,#fafbf9 0%,#e3e8e8 54%,#c4ced3 100%); }
    .ui { pointer-events:none; position:absolute; inset:0; }
    .ui button { pointer-events:auto; cursor:pointer; }
    .topbar { position:absolute; top:28px; left:34px; right:34px; display:flex; align-items:flex-start; justify-content:space-between; gap:24px; }
    .identity { display:flex; align-items:center; gap:15px; }
    .insignia { width:37px; height:42px; color:var(--active); flex:none; }
    h1 { font-size:22px; font-weight:570; margin:0 0 5px; letter-spacing:.17em; }
    .eyebrow { font-size:10px; font-family:"SFMono-Regular",Consolas,monospace; letter-spacing:.16em; color:var(--muted); }
    .exports { display:flex; gap:8px; align-items:center; }
    .export { display:flex; align-items:center; gap:8px; min-height:36px; border:1px solid var(--border); background:var(--panel); padding:8px 12px; border-radius:7px; font-size:11px; letter-spacing:.015em; backdrop-filter:blur(12px); transition:border-color .18s,background .18s; }
    .export:hover { background:var(--hover); border-color:var(--muted); }
    .export.primary { background:var(--active); border-color:var(--active); color:var(--ink); font-weight:650; }
    .export.primary:hover { filter:brightness(1.08); }
    .export:disabled { opacity:.55; cursor:wait; }
    svg { display:block; }
    .export svg { width:15px; height:15px; }
    .toolbar { position:absolute; right:28px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:3px; border:1px solid var(--border); border-radius:10px; padding:5px; background:var(--panel); backdrop-filter:blur(12px); }
    .tool { position:relative; display:flex; width:48px; height:52px; flex-direction:column; align-items:center; justify-content:center; gap:5px; border:0; border-radius:5px; background:transparent; color:var(--muted); font-size:9px; letter-spacing:.04em; transition:background .18s,color .18s; }
    .tool svg { width:18px; height:18px; }
    .tool:hover { color:var(--text); background:var(--hover); }
    .tool[aria-pressed="true"] { color:var(--active); background:var(--hover); }
    .tool[aria-pressed="true"]::after { content:""; position:absolute; right:3px; top:8px; width:3px; height:3px; border-radius:50%; background:var(--active); }
    .separator { height:1px; margin:4px 8px; background:var(--border); }
    .presets { position:absolute; left:50%; bottom:32px; transform:translateX(-50%); display:flex; align-items:center; gap:3px; background:var(--panel); backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:9px; padding:5px; }
    .preset { position:relative; display:flex; min-width:65px; height:43px; justify-content:center; align-items:center; gap:7px; padding:0 11px; border:0; border-radius:5px; font-size:11px; color:var(--muted); background:transparent; transition:background .18s,color .18s; }
    .preset:hover { color:var(--text); background:var(--hover); }
    .preset[aria-pressed="true"] { background:var(--hover); color:var(--text); }
    .preset[aria-pressed="true"]::after { content:""; height:2px; width:17px; position:absolute; bottom:3px; left:calc(50% - 8px); background:var(--active); border-radius:2px; }
    .preset svg { width:16px; height:16px; color:var(--muted); }
    .preset[aria-pressed="true"] svg { color:var(--active); }
    .model-info { position:absolute; left:35px; bottom:35px; font-size:10px; line-height:1.9; color:var(--muted); }
    .model-info .caption { font-family:"SFMono-Regular",Consolas,monospace; font-size:9px; letter-spacing:.12em; }
    .model-info .rule { width:28px; height:1px; background:var(--active); margin-bottom:10px; }
    #metrics { font-variant-numeric:tabular-nums; letter-spacing:.035em; }
    .help { position:absolute; right:34px; bottom:36px; text-align:right; color:var(--muted); font-size:10px; line-height:1.9; }
    .help kbd { font:9px "SFMono-Regular",Consolas,monospace; color:var(--text); }
    .touch-help { display:none; }
    .view-label { position:absolute; top:112px; left:36px; color:var(--muted); font-family:"SFMono-Regular",Consolas,monospace; font-size:9px; letter-spacing:.13em; }
    .view-label span { display:inline-block; width:5px; height:5px; background:var(--active); border-radius:50%; margin-right:9px; vertical-align:1px; }
    .toast { pointer-events:none; position:absolute; left:50%; bottom:105px; transform:translate(-50%,8px); background:var(--panel); border:1px solid var(--border); border-radius:7px; color:var(--text); padding:10px 16px; font-size:12px; line-height:1.6; opacity:0; transition:opacity .2s,transform .2s; max-width:calc(100vw - 32px); text-align:center; }
    .toast.visible { opacity:1; transform:translate(-50%,0); }
    #loading { position:absolute; inset:0; display:grid; place-items:center; background:#1c242e; transition:opacity .35s; z-index:5; }
    #loading.hidden { opacity:0; pointer-events:none; }
    .loading-inner { color:#b1bcc7; text-align:center; font-size:12px; letter-spacing:.07em; }
    .spinner { margin:0 auto 19px; height:30px; width:30px; border:1px solid #43505d; border-top-color:#e9bf6f; border-radius:50%; animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #error { position:absolute; inset:0; display:none; place-items:center; background:#1c242e; z-index:9; padding:30px; }
    .error-inner { max-width:500px; color:#d7dfe7; font-size:14px; line-height:1.8; }
    #error-detail { color:#8f9eab; font:12px/1.6 Consolas,monospace; word-break:break-word; margin-top:15px; }
    @media (max-width:1100px) { .help { display:none; } .presets { left:auto; right:27px; transform:none; } .toolbar { right:27px; } }
    @media (max-width:680px) {
      .topbar { top:20px; left:20px; right:20px; gap:12px; }
      .identity { gap:10px; } .insignia { width:28px; height:33px; }
      h1 { font-size:19px; margin-bottom:4px; } .eyebrow { font-size:8px; letter-spacing:.08em; }
      .export { padding:9px; min-height:34px; } .export span { display:none; }
      .view-label { top:90px; left:21px; font-size:8px; }
      .toolbar { right:13px; padding:4px; border-radius:8px; } .tool { width:39px; height:47px; font-size:8px; gap:5px; } .tool svg { width:17px; height:17px; }
      .presets { left:50%; right:auto; bottom:24px; transform:translateX(-50%); gap:0; padding:4px; }
      .preset { min-width:57px; padding:0 7px; gap:5px; font-size:10px; height:40px; } .preset svg { width:14px; height:14px; }
      .model-info { left:21px; bottom:91px; font-size:9px; } .model-info .rule,.model-info .caption { display:none; }
      .toast { bottom:126px; font-size:11px; }
      .touch-help { display:block; position:absolute; right:20px; bottom:92px; font-size:9px; color:var(--muted); }
    }
    @media (max-height:510px) and (min-width:681px) {
      .topbar { top:17px; left:22px; right:22px; } .view-label { display:none; }
      .toolbar { right:19px; } .tool { height:38px; width:42px; flex-direction:row; gap:5px; } .tool span { display:none; }
      .presets { bottom:18px; } .model-info { left:23px; bottom:21px; }
    }
    @media (prefers-reduced-motion:reduce) { * { transition:none!important; } }
  </style>
</head>
