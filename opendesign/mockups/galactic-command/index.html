<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091117"><base href="/opendesign/mockups/galactic-command/"><title>银河帝国 · 星域指挥</title><link rel="icon" href="data:,"><link rel="stylesheet" href="command.css"><link rel="stylesheet" href="empire-management.css"><link rel="stylesheet" href="astral-ui.css">  <link rel="stylesheet" href="live-battle.css">
</head>
<body>
  <div id="world-scene" aria-label="三维星球与固定建设区"></div>
  <header class="topbar">
    <button class="wordmark" data-page="home">银河帝国</button>
    <nav id="chart-breadcrumbs" aria-label="当前位置"></nav><label class="planet-picker"><span>当前殖民地</span><select id="planet-picker" aria-label="当前殖民地"><option>正在连接…</option></select></label>
    <div id="resources" class="resources" aria-live="off"></div>
    <div class="connection"><i></i><span id="connection">正在连接</span><button id="refresh" aria-label="刷新存档">↻</button></div>
  </header>
  <main id="workspace">
    <section id="home-page" class="view active">


      <aside id="colony-detail" class="side-panel" hidden><button class="chart-close" data-chart="close" aria-label="关闭面板">×</button><h2 id="home-dossier-name">殖民地</h2><p id="home-dossier-status" class="object-status"></p><div id="planet-facts" class="facts"></div><details class="colony-activity"><summary>殖民地运行</summary><div id="home-queues"></div><div id="home-summary"></div></details><button class="text-button" data-page="buildings">全部建筑 →</button></aside>
      <aside id="resource-operations" aria-label="资源综合体产量与容量"></aside>
      <div id="building-labels"></div>
    </section>
    <section id="content-page" class="view"><div class="page-heading"><div><div id="page-eyebrow" class="overline"></div><h1 id="page-title"></h1></div><div id="page-actions"></div></div><div id="page-body" class="page-body"></div></section>
    <section id="hangar-page" class="view"><iframe id="hangar" title="全舰船三维档案与克制表" src="about:blank"></iframe></section>
    <section id="battle-page" class="view"><div id="mass-battle"></div></section>
    <section id="system-page" class="view"><aside id="system-target" class="side-panel" hidden></aside></section>
    <section id="galaxy-page" class="view"><aside id="black-hole-panel" class="side-panel" hidden><button class="chart-close" data-chart="close" aria-label="关闭面板">×</button><h2>卡冈图雅</h2><p class="info-note">银心黑洞 · 探索 30 分钟，往返另算</p><button class="primary" data-black-hole>派舰队探险 ↗</button></aside></section>
  </main>
  <div id="chart-chrome">
    <nav id="chart-tools" aria-label="星图工具"><button data-chart-panel="colonies" aria-controls="empire-nav" aria-expanded="false">殖民地</button><button data-chart-panel="orbits" aria-controls="orbit-dock" aria-expanded="false">轨道</button><button data-chart-panel="view" aria-controls="chart-view-menu" aria-expanded="false">视角</button></nav>
    <aside id="chart-view-menu" class="chart-menu" aria-label="视角与操作" hidden><button class="chart-close" data-chart="close" aria-label="关闭面板">×</button><h2>视角</h2><div class="view-actions"><button data-chart="back" class="back-tool">↶ <span>返回上级</span><kbd>Esc</kbd></button><button data-chart="reset">重置视角</button><button data-chart="drag" aria-pressed="false">拖拽平移</button><button data-strategy="territories" aria-pressed="true">势力边界 <kbd>B</kbd></button><div class="zoom-actions"><button data-chart="zoom-out" aria-label="缩小">−</button><span>缩放</span><button data-chart="zoom-in" aria-label="放大">+</button></div></div><details class="chart-help"><summary>操作帮助</summary><p id="chart-hint">拖拽旋转 · 右键平移 · 滚轮缩放<br>单击查看档案 · 双击进入<br>H 定位母星 · C 查看疆域 · G 银河<br>触屏：单指拖拽，双指缩放</p></details></aside>
    <aside id="empire-nav" aria-label="殖民地导航" hidden><button class="chart-close" data-chart="close" aria-label="关闭面板">×</button>
      <div class="empire-head"><span class="empire-seal">◇</span><div><strong id="empire-name"></strong></div></div><p id="empire-counts"></p>
      <div class="empire-actions"><button data-strategy="fit">查看全部疆域 <kbd>C</kbd></button><button data-page="logistics">物流中心</button></div>
      <div class="colony-heading">我的星球 <span id="chart-colony-count"></span></div><input id="chart-colony-search" aria-label="搜索星球或恒星系" placeholder="搜索星球或恒星系…" autocomplete="off"><div id="chart-colonies"></div>
      <details id="chart-economy"><summary>殖民地资源</summary><div id="chart-resource-values"></div><div class="empire-actions"><button data-page="buildings">建设</button><button data-page="research">研究</button><button data-page="fleet">舰队</button></div></details>

    </aside>
    <aside id="galaxy-inspector" class="side-panel" hidden></aside>
  </div>
  <section id="map-pilot-hud" hidden aria-label="战舰驾驶"><div class="pilot-crosshair">＋</div><div class="bridge-heading"><span id="map-cabin-name"></span><small id="map-cabin-mode"></small></div><aside class="bridge-contacts"><label for="map-combat-target">敌方单位 / CONTACTS</label><select id="map-combat-target" aria-label="敌方单位"></select><button id="map-pilot-lock" data-combat="lock">锁定对准 · X</button><button id="map-pilot-auto" data-combat="auto">AUTO · 自动驾驶</button><button id="map-pilot-seat" data-combat="seat">返回作战席 · C</button><output id="map-pilot-telemetry"></output><output id="map-pilot-range"></output><output id="map-pilot-weapon-state" aria-live="polite"></output><output id="map-pilot-command" aria-live="polite"></output></aside><p id="map-pilot-status"></p><p id="map-pilot-help"></p><div class="bridge-weapons"><button data-combat="fire">主炮 · Space</button><button data-combat="missile">导弹 · R</button></div></section>
  <section id="map-combat-bar" hidden aria-label="星图现场交战"><div><strong id="map-combat-title"></strong><small id="map-combat-counts"></small></div><nav><select id="map-combat-vessel" aria-label="选择舰船并驾驶"></select><select id="map-combat-camera" aria-label="摄像头"><option value="bridge">驾驶舱 · V</option><option value="follow">第三人称 · V</option></select><button id="map-combat-pilot" data-combat="pilot">接管驾驶</button><button id="map-combat-pause" data-combat="pause" hidden>暂停</button><select id="map-combat-speed" aria-label="回放速度" hidden><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select><button data-combat="close">结束观察</button></nav><input id="map-combat-seek" aria-label="回放时间" type="range" min="0" max="1" step=".1" hidden></section>
  <section id="orbit-dock" aria-label="轨道索引" hidden><div class="dock-top"><span>当前恒星系</span><button class="chart-close" data-chart="close" aria-label="关闭面板">×</button></div><nav id="system-orbits" aria-label="当前恒星系天体"></nav></section>
  <footer class="bottom-bar"><nav aria-label="主导航"><button class="active" data-page="galaxy">星图</button><button data-page="buildings">建设</button><button data-page="shipyard">造舰</button><button data-page="research">研究</button><button data-page="fleet">舰队</button><button data-page="hangar">档案</button><button data-page="battle">战场</button><button data-page="reports">战报<i id="unread-count"></i></button><button data-page="empire">王庭</button><button data-page="more">更多</button></nav><span id="commander" class="commander"></span></footer>
  <dialog id="detail-modal" aria-labelledby="modal-title"><div class="dialog-head"><div><div class="overline" id="modal-eyebrow">DETAIL</div><h2 id="modal-title"></h2></div><button id="close-modal" aria-label="关闭详情">×</button></div><div id="modal-body"></div></dialog>
  <div id="notification" role="status" aria-live="polite"></div>
  <div id="loading"><div class="loading-orbit"></div><h2>正在连接星域</h2><p>载入殖民地、舰队与科技档案</p><button id="retry" class="primary" hidden>重新连接</button></div>
  <script src="../../shared/space-sky.js"></script><script src="api.js"></script><script src="mass-battle.js"></script><script src="live-battle.bundle.js"></script><script src="planet.bundle.js"></script><script src="system-logistics.js"></script><script src="empire-management.js"></script><script src="operations.bundle.js"></script><script src="command.js"></script>
</body></html>
