<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>舰队 WebGL 自检</title>
<style>html,body{margin:0;height:100%;background:#070f1c;color:#cad8e6;font:12px system-ui}#battle{height:calc(100% - 42px)}#result{height:30px;padding:6px 15px;white-space:pre-wrap}</style>
<div id="battle"></div><div id="result" role="status">正在载入真实舰船目录…</div>
<script src="mass-battle.js"></script>
<script>
  fetch('/api/catalog').then(r=>{if(!r.ok)throw Error('目录请求失败');return r.json();}).then(catalog=>{
    window.battle=new MassBattle(document.querySelector('#battle'),catalog).mount();
    if(!battle.start({size:20000}))throw Error('20,000 艘部署失败，检查上方图形提示。');
    battle.paused=true;battle.setActive(true);
    const timer=setInterval(()=>{
      const stats=battle.snapshot();
      document.querySelector('#result').textContent=JSON.stringify(stats);
      if(stats.instances!==stats.alive[0]+stats.alive[1])throw Error('绘制数与存活单舰数不符');
    },1000);
    addEventListener('pagehide',()=>{clearInterval(timer);battle.destroy();},{once:true});
  }).catch(error=>document.querySelector('#result').textContent=error.message);
</script>
</html>
