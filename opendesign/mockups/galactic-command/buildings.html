<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>建筑工坊 · 银河帝国</title><link rel="stylesheet" href="buildings.css"></head>
<body>
<header><a href="/">银河帝国 <span>GALACTIC IMPERIUM</span></a><div class="header-title">建筑工坊 <small>01 / INDUSTRIAL COLLECTION</small></div><a class="back" href="/">返回主星 ↗</a></header>
