</style></head><body><main><nav><a href="index.html">← 操作星球样板</a><a href="data-review.html">审阅待补数据 →</a></nav><h1>类地星建造 · 验收影像</h1><p>第一轮独立样板。建筑与地形采用统一画风；影像记录三类矿区的实际运行画面。</p><h2>全球分布</h2><div class="pair"><figure><img src="evidence/global-front.png" alt="星球正面建设区分布"><figcaption>全球正面</figcaption></figure><figure><img src="evidence/global-back.png" alt="星球背面建设区分布"><figcaption>全球背面</figcaption></figure></div><h2>三类采集循环</h2><div class="clips"><figure><video controls preload="metadata" src="evidence/metal.webm" poster="evidence/metal.png"></video><figcaption>金属：赴矿、装载、满载返程、仓库卸货。</figcaption></figure><figure><video controls preload="metadata" src="evidence/crystal.webm" poster="evidence/crystal.png"></video><figcaption>晶体：行走、接触钻采、携带晶体、返仓卸货。</figcaption></figure><figure><video controls preload="metadata" src="evidence/gas.webm" poster="evidence/gas.png"></video><figcaption>气体：气井、管道、往复泵和压缩机。</figcaption></figure></div><h2>施工与移动端</h2><div class="pair"><figure><img src="evidence/construction.png" alt="固定槽位的施工脚手架与进度"><figcaption>固定槽位施工</figcaption></figure><figure><img src="evidence/mobile.png" alt="移动端星球验收页面"><figcaption>移动端布局</figcaption></figure></div></main></body></html>
